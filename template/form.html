<form class="lead quick" action="https://formsubmit.co/{{email}}" method="POST">
  <input type="hidden" name="_subject" value="New lead — {{business}} ({{cityst}})">
  <input type="hidden" name="_next" value="https://www.{{domain}}/thank-you/">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="site" value="{{domain}}">
  <input type="hidden" name="page" value="{{path}}">
  <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" aria-label="Leave this field empty">
  <label>Phone<input type="tel" name="phone" required autocomplete="tel" inputmode="tel" placeholder="We call back in minutes"></label>
  <label>Name<input type="text" name="name" required autocomplete="name"></label>
  <label>What do you need?
    <select name="service" required>
      <option value="">Choose one</option>
      <option>Locked out of my car</option>
      <option>Locked out of my home</option>
      <option>Locked out of my business</option>
      <option>Lost / broken car key — need a new one</option>
      <option>Key fob programming</option>
      <option>Ignition problem</option>
      <option>Rekey my locks</option>
      <option>Install or replace locks</option>
      <option>Smart lock installation</option>
      <option>Commercial / master key / access control</option>
      <option>Safe opening</option>
      <option>Something else</option>
    </select>
  </label>
  <details class="more-fields"><summary>Add location, car or details (optional)</summary>
    <label>Where are you? (address or neighborhood in {{city}})<input type="text" name="address" autocomplete="street-address"></label>
    <label>Car year, make and model (for car keys)<input type="text" name="vehicle" placeholder="e.g. 2019 Honda Civic"></label>
    <label>Anything else?<textarea name="message" rows="2"></textarea></label>
  </details>
  <label class="consent"><input type="checkbox" name="consent" value="yes" required> I agree to the <a href="/privacy/">Privacy Policy</a> and <a href="/terms/">Terms</a>, and to be contacted by phone or text about this request.</label>
  <button class="call" type="submit">Request a call back</button>
  <p class="form-note">Locked out right now? Phone <a href="tel:+1{{phone_digits}}">{{phone}}</a> or <a href="sms:+1{{sms_digits}}?&body=Hi%2C%20I%20need%20a%20locksmith%20in%20{{city}}">text us</a>.</p>
</form>
